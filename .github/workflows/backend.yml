name: Backend CI/CD

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

defaults:
  run:
    working-directory: emp_leave_backend

jobs:
  # =============================================
  # Stage 1: Build & Lint
  # =============================================
  build:
    name: 🏗️ Build & Lint
    runs-on: ubuntu-latest

    steps:
    - name: 🚀 Checkout Code
      uses: actions/checkout@v4

    - name: 🛠️ Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: 📦 Cache NuGet Packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj*') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: 🔍 Restore Dependencies
      run: dotnet restore EmployeeLeaveApp.sln

    - name: 🧹 Check Code Format
      run: dotnet format --verify-no-changes --no-restore
      continue-on-error: true

    - name: 🏗️ Build Solution
      run: dotnet build EmployeeLeaveApp.sln --no-restore --configuration Release --no-incremental

    - name: 📁 Publish Application
      run: dotnet publish src/EmployeeLeaveApi/EmployeeLeaveApi.csproj -c Release -o ./publish --no-build

    - name: 📤 Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: backend-release
        path: emp_leave_backend/publish
        retention-days: 14

  # =============================================
  # Stage 2: Test & Coverage
  # =============================================
  test:
    name: 🧪 Test & Coverage
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: 🚀 Checkout Code
      uses: actions/checkout@v4

    - name: 🛠️ Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: 📦 Cache NuGet Packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj*') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: 🔍 Restore Dependencies
      run: dotnet restore EmployeeLeaveApp.sln

    - name: 🧪 Run Tests with Coverage
      run: |
        dotnet test EmployeeLeaveApp.sln \
          --configuration Release \
          --collect:"XPlat Code Coverage" \
          --results-directory ./TestResults \
          --logger "trx;LogFileName=test-results.trx" \
          --verbosity normal

    - name: 📊 Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: emp_leave_backend/TestResults
        retention-days: 14

    - name: 📈 Generate Coverage Summary
      if: always()
      run: |
        echo "## 🧪 Test Results Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -f ./TestResults/test-results.trx ]; then
          echo "✅ Test execution completed" >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "📊 Coverage reports uploaded as artifacts" >> $GITHUB_STEP_SUMMARY

  # =============================================
  # Stage 3: Security Scan
  # =============================================
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: 🚀 Checkout Code
      uses: actions/checkout@v4

    - name: 🛠️ Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: 🔍 Restore Dependencies
      run: dotnet restore EmployeeLeaveApp.sln

    - name: 🔐 Check Vulnerable Packages
      run: |
        echo "## 🔒 Security Scan Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        dotnet list EmployeeLeaveApp.sln package --vulnerable --include-transitive 2>&1 | tee security-report.txt
        if grep -q "has the following vulnerable packages" security-report.txt; then
          echo "⚠️ Vulnerable packages detected! Review the report below." >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat security-report.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        else
          echo "✅ No known vulnerabilities found" >> $GITHUB_STEP_SUMMARY
        fi
      continue-on-error: true

    - name: 🐳 Build Docker Image
      run: docker build -t emp-leave-backend:${{ github.sha }} .

  # =============================================
  # Stage 4: Deploy to Render
  # =============================================
  deploy:
    name: 🚀 Deploy to Render
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment: production

    steps:
    - name: 🌐 Trigger Render Deploy
      run: |
        echo "## 🚀 Deployment" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "✅ Deploy hook triggered successfully" >> $GITHUB_STEP_SUMMARY
          echo "🔗 Check status at: https://dashboard.render.com" >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ RENDER_DEPLOY_HOOK_URL secret not set. Skipping deploy." >> $GITHUB_STEP_SUMMARY
          echo "Set it in: GitHub → Settings → Secrets → RENDER_DEPLOY_HOOK_URL" >> $GITHUB_STEP_SUMMARY
        fi

    - name: 📋 Post-Deploy Summary
      run: |
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📋 Deploy Info" >> $GITHUB_STEP_SUMMARY
        echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
        echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| Actor | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Timestamp | $(date -u +'%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY
