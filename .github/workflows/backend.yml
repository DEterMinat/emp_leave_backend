name: Backend CI/CD

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    name: Build & Quality Check
    runs-on: ubuntu-latest
    
    steps:
    - name: 🚀 Checkout Code
      uses: actions/checkout@v4
    
    - name: 🛠️ Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        
    - name: 📦 Cache NuGet Packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj*') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: 🔍 Restore Dependencies
      run: dotnet restore EmployeeLeaveApp.sln
      
    - name: 🧹 Check Code Format
      run: dotnet format --verify-no-changes
      
    - name: 🏗️ Build Solution
      run: dotnet build EmployeeLeaveApp.sln --no-restore --configuration Release
      
    - name: 🧪 Run Tests
      run: dotnet test EmployeeLeaveApp.sln --no-build --configuration Release
      
    - name: 📁 Publish Application
      run: dotnet publish src/EmployeeLeaveApi/EmployeeLeaveApi.csproj -c Release -o ./publish

    - name: 🐳 Build Docker Image
      run: docker build -t emp-leave-backend:latest .

    - name: 📤 Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: backend-release
        path: ./publish
        retention-days: 7
